name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm pack --dry-run

  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh_version: 0.1.0-rc.6
            experimental: false
          - dsh_version: latest
            experimental: false
          - dsh_version: next
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - id: smoke
        continue-on-error: ${{ matrix.experimental }}
        uses: fieldnote-ops/harnessproof@2b7a246ab595313366cd9806380c3ff0fd6264c9
        with:
          plugin_path: .
          dsh_version: ${{ matrix.dsh_version }}
          report_path: harnessproof-${{ matrix.dsh_version }}.json
      - if: ${{ !matrix.experimental && steps.smoke.outcome != 'success' }}
        run: exit 1
