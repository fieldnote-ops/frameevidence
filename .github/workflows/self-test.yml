name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm pack --dry-run

  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dsh_version: [0.1.0-rc.6, latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - uses: fieldnote-ops/harnessproof@6301a34b353a328c22fed21378d98301695d41ca
        with:
          plugin_path: .
          dsh_version: ${{ matrix.dsh_version }}
          report_path: harnessproof-${{ matrix.dsh_version }}.json
